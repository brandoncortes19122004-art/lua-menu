<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LÚA · Menú de granizados</title>
<meta name="description" content="Menú de granizados LÚA: mango biche, limonada de coco, maralupiña, maracumango, pati fress, lulada y chamoyada. Toca cada foto para ver ingredientes y precios.">
<meta name="theme-color" content="#739A4E">
<meta property="og:title" content="LÚA · Menú de granizados">
<meta property="og:description" content="Toca cada foto para ver ingredientes y precios.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥭</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F9F6EF;--navy:#0B3A5C;--green:#739A4E;--sun:#F9C32B;--sky:#3EB0E8;--ink:#0B3A5C;--card:#fff;--shadow:rgba(11,58,92,.18);--muted:rgba(11,58,92,.72)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#10222e;--navy:#F3EEDF;--ink:#F3EEDF;--card:#173141;--shadow:rgba(0,0,0,.5);--muted:rgba(243,238,223,.75)}}
:root[data-theme="dark"]{--cream:#10222e;--navy:#F3EEDF;--ink:#F3EEDF;--card:#173141;--shadow:rgba(0,0,0,.5);--muted:rgba(243,238,223,.75)}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;z-index:0;pointer-events:none}
.b1{top:-90px;left:-90px;width:220px;height:220px;background:var(--sun);border-radius:50% 40% 60% 30%}
.b2{top:-60px;right:-70px;width:180px;height:180px;background:var(--sky);border-radius:40% 60% 50% 50%}
.b3{bottom:-110px;right:-80px;width:240px;height:240px;background:var(--sun);opacity:.55;border-radius:50% 50% 30% 60%}
.b4{bottom:-90px;left:-70px;width:200px;height:200px;background:var(--sky);opacity:.55;border-radius:60% 40% 50% 50%}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:28px 20px 40px}
header{text-align:center}
.logo{display:inline-block;background:var(--green);color:#fff;font-family:'Libre Baskerville',serif;font-weight:700;font-size:46px;padding:14px 58px 18px;border-radius:50% 50% 46% 54%/60% 60% 40% 40%;letter-spacing:2px}
h1{font-family:'Libre Baskerville',serif;font-size:clamp(34px,6vw,52px);margin:18px 0 8px}
.tag{display:inline-block;background:var(--sun);color:#0B3A5C;font-family:'Libre Baskerville',serif;font-weight:700;padding:8px 26px;border-radius:30px 18px 34px 18px;font-size:20px}
.hint{margin:14px 0 0;font-size:14px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:26px 0 0}
.filters button{cursor:pointer;font:600 14px Montserrat;color:var(--ink);background:transparent;border:2px solid var(--green);border-radius:999px;padding:9px 18px}
.filters button[aria-pressed="true"]{background:var(--green);color:#fff}
.count{text-align:center;font-size:13px;color:var(--muted);margin:14px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:36px 22px;margin-top:24px;list-style:none;padding:0}
.item{text-align:center}
.item[hidden]{display:none}
.pic{all:unset;cursor:pointer;display:block;width:100%;aspect-ratio:3/3.8;border-radius:999px;overflow:hidden;background:#eee;box-shadow:0 8px 20px var(--shadow);transition:transform .25s,box-shadow .25s;position:relative;-webkit-tap-highlight-color:transparent}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic:hover,.pic:focus-visible{transform:translateY(-6px) scale(1.03);box-shadow:0 14px 28px var(--shadow)}
.pic:focus-visible{outline:4px solid var(--sky);outline-offset:4px}
.pic .plus{position:absolute;right:14%;bottom:7%;width:38px;height:38px;border-radius:50%;background:var(--sun);color:#0B3A5C;font:700 22px/38px Montserrat;text-align:center}
.name{font-family:'Libre Baskerville',serif;font-weight:700;font-size:18px;margin:14px 0 0}
.mini{font-size:12.5px;color:var(--muted);margin:4px 8px 0;line-height:1.4}
.from{font-size:13px;font-weight:600;margin-top:6px}
footer{position:relative;z-index:1;text-align:center;padding:10px 20px 50px;font-size:13px;color:var(--muted)}
footer a{color:var(--ink);font-weight:600}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:12px}
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;overflow:auto}
dialog::backdrop{background:rgba(11,58,92,.6);backdrop-filter:blur(3px)}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{position:relative;background:var(--card);color:var(--ink);border-radius:28px;max-width:760px;width:100%;display:grid;grid-template-columns:270px 1fr;gap:30px;padding:32px;box-shadow:0 30px 60px rgba(0,0,0,.35);animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.big{width:100%;aspect-ratio:3/3.8;border-radius:999px;overflow:hidden;box-shadow:0 8px 22px var(--shadow)}
.big img{width:100%;height:100%;object-fit:cover}
.info h2{font-family:'Libre Baskerville',serif;font-size:30px;margin:4px 40px 6px 0}
.perfil{font-size:14px;color:var(--muted);margin:0 0 4px;line-height:1.5}
.info h3{font-size:14px;margin:18px 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.chips li{background:var(--sun);color:#0B3A5C;font-weight:600;font-size:13px;padding:6px 12px;border-radius:10px}
.chips.tags li{background:transparent;border:2px solid var(--sky);color:var(--ink)}
.sizes{display:flex;gap:10px}
.sizes button{flex:1;cursor:pointer;font:600 15px Montserrat;color:var(--ink);background:transparent;border:2px solid var(--green);border-radius:16px;padding:10px 6px}
.sizes button[aria-pressed="true"]{background:var(--green);color:#fff}
.price{font-family:'Libre Baskerville',serif;font-size:38px;font-weight:700;margin:14px 0 0}
.extra{font-size:13px;color:var(--muted);margin:2px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{cursor:pointer;font:700 14px Montserrat;border:0;border-radius:14px;padding:12px 18px;text-decoration:none;display:inline-block}
.btn.wa{background:#25D366;color:#073b1b}
.btn.sh{background:var(--sun);color:#0B3A5C}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{cursor:pointer;font:600 14px Montserrat;background:var(--sky);color:#0B3A5C;border:0;border-radius:14px;padding:10px 16px}
button:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.x{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:0;background:var(--navy);color:var(--cream);font-size:20px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 18px;border-radius:999px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:640px){.sheet{grid-template-columns:1fr;padding:22px;gap:16px}.big{max-width:210px;margin:0 auto}.info h2{margin-right:0;text-align:center}.perfil{text-align:center}.grid{grid-template-columns:repeat(2,1fr);gap:28px 14px}.logo{font-size:36px;padding:12px 40px 16px}.mini{display:none}.btn{flex:1;text-align:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

<main>

<div class="info">

const fmt=n=>'$'+n.toLocaleString('es-CO');
const has=(p,w)=>p.ing.some(i=>i.toLowerCase()===w);
const TAGS=[
 {k:'picante',t:'Con toque picante',f:p=>['pimienta','tajín','chamoy'].some(w=>has(p,w))},
 {k:'cremoso',t:'Con leche condensada',f:p=>has(p,'leche condensada')},
 {k:'mango',t:'Con mango',f:p=>has(p,'mango')},
 {k:'citrico',t:'Con limón',f:p=>has(p,'limón')},
 {k:'salado',t:'Con sal',f:p=>has(p,'sal')||has(p,'tajín')}
];
const FILTERS=[{k:'todos',t:'Todos'},{k:'picante',t:'Con picante'},{k:'cremoso',t:'Con leche condensada'},{k:'mango',t:'Con mango'}];
const PERFIL={
 "Mango Biche":"Mango con limón, sal y pimienta, suavizado con leche condensada.",
 "Limonada de Coco":"La limonada de coco en granizado, con leche condensada.",
 "Maralupiña":"Mango, maracuyá y piña con limón, sal y pimienta.",
 "Maracumango":"Mango y maracuyá con limón, sal y pimienta.",
 "Pati Fress Lúa":"Patilla y fresa con limón y leche condensada.",
 "Lulada":"Lulo con limón y leche condensada. El más económico del menú.",
 "Chamoyada":"Mango con Tajín, chamoy, limón y tamarindo."
};
const grid=document.getElementById('grid'),dlg=document.getElementById('dlg');
let cur=0,size=12,filter='todos';
function tagsOf(p){return TAGS.filter(t=>t.f(p)).map(t=>t.t)}
D.forEach((p,i)=>{
 p.tagKeys=TAGS.filter(t=>t.f(p)).map(t=>t.k);
 const li=document.createElement('li');li.className='item';li.dataset.i=i;
 li.innerHTML=`<button class="pic" aria-label="Ver detalles de ${p.n}"><img src="${p.img}" alt="Granizado ${p.n}" loading="lazy"><span class="plus" aria-hidden="true">+</span></button><p class="name">${p.n}</p><p class="mini">${p.ing.join(' · ')}</p><div class="from">12 oz ${fmt(p.p12)} · 16 oz ${fmt(p.p16)}</div>`;
 li.querySelector('button').onclick=()=>{cur=i;size=12;render();dlg.showModal()};
 grid.appendChild(li);
});
const fbox=document.getElementById('filters');
FILTERS.forEach(f=>{const b=document.createElement('button');b.textContent=f.t;b.setAttribute('aria-pressed',String(f.k==='todos'));
 b.onclick=()=>{filter=f.k;fbox.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));applyFilter()};fbox.appendChild(b)});
function visible(){return D.map((p,i)=>i).filter(i=>filter==='todos'||D[i].tagKeys.includes(filter))}
function applyFilter(){
 const v=visible();
 grid.querySelectorAll('.item').forEach(li=>li.hidden=!v.includes(+li.dataset.i));
 document.getElementById('count').textContent=v.length+(v.length===1?' granizado':' granizados');
}
applyFilter();
function render(){
 const p=D[cur];
 const im=document.getElementById('bimg');im.src=p.img;im.alt='Granizado '+p.n;
 document.getElementById('dname').textContent=p.n;
 document.getElementById('perfil').textContent=PERFIL[p.n]||'';
 document.getElementById('ing').innerHTML=p.ing.map(x=>`<li>${x}</li>`).join('');
 document.getElementById('tags').innerHTML=tagsOf(p).map(x=>`<li>${x}</li>`).join('');
 document.querySelectorAll('.sizes button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.s===size)));
 const pr=size===12?p.p12:p.p16;
 document.getElementById('price').textContent=fmt(pr);
 document.getElementById('extra').textContent=size===12?`Por ${fmt(p.p16-p.p12)} más lo pasas a 16 oz.`:`Son ${fmt(p.p16-p.p12)} más que el de 12 oz.`;
 const wa=document.getElementById('wa');
 if(CONFIG.whatsapp){wa.hidden=false;wa.href='https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(`Hola, quiero un granizado ${p.n} de ${size} oz (${fmt(pr)}).`)}
}
document.querySelectorAll('.sizes button').forEach(b=>b.onclick=()=>{size=+b.dataset.s;render()});
function go(d){const v=visible();let k=v.indexOf(cur);k=(k+d+v.length)%v.length;cur=v[k];render()}
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.getElementById('close').onclick=()=>dlg.close();
document.getElementById('wrap').addEventListener('click',e=>{if(e.target.id==='wrap')dlg.close()});
dlg.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
const toast=document.getElementById('toast');
function say(t){toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2200)}
document.getElementById('share').onclick=async()=>{
 const p=D[cur],text=`${p.n} (${size} oz) ${fmt(size===12?p.p12:p.p16)} · LÚA`;
 try{if(navigator.share){await navigator.share({title:'LÚA · '+p.n,text,url:location.href})}
 else{await navigator.clipboard.writeText(text+' '+location.href);say('Enlace copiado')}}catch(e){}
};
const links=document.getElementById('links');
if(CONFIG.instagram)links.innerHTML+=`<a href="${CONFIG.instagram}" target="_blank" rel="noopener">Instagram</a>`;
if(CONFIG.ubicacion)links.innerHTML+=`<a href="${CONFIG.ubicacion}" target="_blank" rel="noopener">Cómo llegar</a>`;
if(CONFIG.whatsapp)links.innerHTML+=`<a href="https://wa.me/${CONFIG.whatsapp}" target="_blank" rel="noopener">WhatsApp</a>`;
if(CONFIG.direccion)links.insertAdjacentHTML('afterend',`<div>${CONFIG.direccion}</div>`);
</script>
